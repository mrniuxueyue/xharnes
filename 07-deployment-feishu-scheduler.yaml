# Feishu / Lark Channel Gateway (supports WebSocket long-connection & HTTP webhook mode)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: x-harness-feishu
  namespace: x-harness
  labels:
    app.kubernetes.io/component: feishu
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: x-harness
      app.kubernetes.io/component: feishu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: x-harness
        app.kubernetes.io/component: feishu
    spec:
      serviceAccountName: x-harness
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: x-harness
              app.kubernetes.io/component: feishu
      containers:
        - name: feishu
          image: registry.example.com/xh/server:1.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: x-harness-config
          env:
            - name: XH_ROLES
              value: "feishu"
            - name: XH_PG_WRITE_URL
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: pg_write_url } }
            - name: XH_PG_READ_URL
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: pg_read_url, optional: true } }
            - name: XH_REDIS_CACHE_URL
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: redis_cache_url } }
            - name: XH_REDIS_STREAMS_URL
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: redis_streams_url } }
            - name: XH_MASTER_KEY
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: xh_master_key } }
            - name: XH_S3_ENDPOINT
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: s3_endpoint, optional: true } }
            - name: XH_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: s3_access_key, optional: true } }
            - name: XH_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: s3_secret_key, optional: true } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: x-harness-feishu
  namespace: x-harness
  labels:
    app.kubernetes.io/component: feishu
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: x-harness
    app.kubernetes.io/component: feishu
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Leader-elected Scheduler: Cron automations, stuck-run reaper, approval/card expiry, warm sandbox pool refill, retention
apiVersion: apps/v1
kind: Deployment
metadata:
  name: x-harness-scheduler
  namespace: x-harness
  labels:
    app.kubernetes.io/component: scheduler
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: x-harness
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: x-harness
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: x-harness
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: x-harness
              app.kubernetes.io/component: scheduler
      containers:
        - name: scheduler
          image: registry.example.com/xh/server:1.4.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: x-harness-config
          env:
            - name: XH_ROLES
              value: "scheduler"
            - name: XH_PG_WRITE_URL
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: pg_write_url } }
            - name: XH_PG_READ_URL
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: pg_read_url, optional: true } }
            - name: XH_REDIS_CACHE_URL
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: redis_cache_url } }
            - name: XH_REDIS_STREAMS_URL
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: redis_streams_url } }
            - name: XH_MASTER_KEY
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: xh_master_key } }
            - name: XH_S3_ENDPOINT
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: s3_endpoint, optional: true } }
            - name: XH_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: s3_access_key, optional: true } }
            - name: XH_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: s3_secret_key, optional: true } }
            - name: XH_OPENSANDBOX_API_KEY
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: opensandbox_api_key, optional: true } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
