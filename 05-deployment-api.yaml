apiVersion: apps/v1
kind: Deployment
metadata:
  name: x-harness-api
  namespace: x-harness
  labels:
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: x-harness
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: x-harness
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: x-harness
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: x-harness
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: registry.example.com/xh/server:1.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: x-harness-config
          env:
            - name: XH_ROLES
              value: "api"
            - name: XH_PG_WRITE_URL
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: pg_write_url } }
            - name: XH_PG_READ_URL
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: pg_read_url, optional: true } }
            - name: XH_REDIS_CACHE_URL
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: redis_cache_url } }
            - name: XH_REDIS_STREAMS_URL
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: redis_streams_url } }
            - name: XH_MASTER_KEY
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: xh_master_key } }
            - name: XH_S3_ENDPOINT
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: s3_endpoint, optional: true } }
            - name: XH_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: s3_access_key, optional: true } }
            - name: XH_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: s3_secret_key, optional: true } }
            - name: XH_OPENSANDBOX_API_KEY
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: opensandbox_api_key, optional: true } }
            - name: XH_METRICS_TOKEN
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: metrics_token, optional: true } }
            - name: TAVILY_API_KEY
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: tavily_api_key, optional: true } }
            - name: SERPER_API_KEY
              valueFrom: { secretKeyRef: { name: x-harness-secrets, key: serper_api_key, optional: true } }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: x-harness-api
  namespace: x-harness
  labels:
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: x-harness
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
