# ==============================================================================
# Optional Self-Hosted Backing Infrastructure for Private-Cloud / Staging Clusters
# Includes:
#   1. PostgreSQL 16 + pgvector (StatefulSet + PVC)
#   2. Redis Cache (allkeys-lru)
#   3. Redis Streams (noeviction + AOF PVC)
#   4. MinIO Standard S3 (StatefulSet + PVC + bucket bootstrap Job)
#   5. OpenSandbox Control Plane in x-harness-sandbox namespace
#
# NOTE: Replace CHANGE_ME passwords below before applying, matching deploy/k8s/02-secret.example.yaml.
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: x-harness
  labels:
    app.kubernetes.io/name: x-harness
---
apiVersion: v1
kind: Namespace
metadata:
  name: x-harness-sandbox
  labels:
    app.kubernetes.io/name: x-harness-sandbox
    app.kubernetes.io/part-of: x-harness
---
apiVersion: v1
kind: Secret
metadata:
  name: x-harness-infra-secrets
  namespace: x-harness
type: Opaque
stringData:
  postgres_password: "CHANGE_ME_PG_PASSWORD"
  minio_root_user: "CHANGE_ME_S3_ACCESS_KEY"
  minio_root_password: "CHANGE_ME_S3_SECRET_KEY"
  opensandbox_api_key: "CHANGE_ME_OPENSANDBOX_API_KEY"
---
# ── 1. PostgreSQL 16 + pgvector ────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: x-harness-postgres
  namespace: x-harness
spec:
  serviceName: x-harness-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: x-harness-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: x-harness-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "xh"
            - name: POSTGRES_USER
              value: "xh"
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: x-harness-infra-secrets, key: postgres_password } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "xh", "-d", "xh"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: x-harness-postgres
  namespace: x-harness
spec:
  selector:
    app.kubernetes.io/name: x-harness-postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
---
# ── 2. Redis Cache (sessions, rate-limit, context cache — LRU eviction OK) ─────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: x-harness-redis-cache
  namespace: x-harness
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: x-harness-redis-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: x-harness-redis-cache
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: x-harness-redis-cache
  namespace: x-harness
spec:
  selector:
    app.kubernetes.io/name: x-harness-redis-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# ── 3. Redis Streams (run queue & SSE event streams — NOEVICTION + AOF PVC) ────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: x-harness-redis-streams
  namespace: x-harness
spec:
  serviceName: x-harness-redis-streams
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: x-harness-redis-streams
  template:
    metadata:
      labels:
        app.kubernetes.io/name: x-harness-redis-streams
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: x-harness-redis-streams
  namespace: x-harness
spec:
  selector:
    app.kubernetes.io/name: x-harness-redis-streams
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# ── 4. MinIO S3 Object Storage ─────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: x-harness-minio
  namespace: x-harness
spec:
  serviceName: x-harness-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: x-harness-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: x-harness-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: x-harness-infra-secrets, key: minio_root_user } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: x-harness-infra-secrets, key: minio_root_password } }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: api }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: x-harness-minio
  namespace: x-harness
spec:
  selector:
    app.kubernetes.io/name: x-harness-minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: batch/v1
kind: Job
metadata:
  name: x-harness-minio-init
  namespace: x-harness
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: x-harness-infra-secrets, key: minio_root_user } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: x-harness-infra-secrets, key: minio_root_password } }
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set local http://x-harness-minio.x-harness.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done
              mc mb --ignore-existing local/xh-prod
---
# ── 5. OpenSandbox Server (Kubernetes Runtime inside x-harness-sandbox) ────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensandbox-server
  namespace: x-harness-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensandbox-pod-manager
  namespace: x-harness-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensandbox-pod-manager
  namespace: x-harness-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opensandbox-pod-manager
subjects:
  - kind: ServiceAccount
    name: opensandbox-server
    namespace: x-harness-sandbox
---
apiVersion: v1
kind: Secret
metadata:
  name: opensandbox-secret
  namespace: x-harness-sandbox
type: Opaque
stringData:
  opensandbox_api_key: "CHANGE_ME_OPENSANDBOX_API_KEY"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensandbox-config
  namespace: x-harness-sandbox
data:
  config.toml: |
    [server]
    host = "0.0.0.0"
    port = 8080
    log_level = "info"

    [runtime]
    type = "kubernetes"
    namespace = "x-harness-sandbox"

    [limits]
    default_cpu = 2
    default_memory_mb = 2048
    default_disk_mb = 5120
    max_ttl_seconds = 14400

    [security]
    api_key_file = "/etc/opensandbox/secrets/opensandbox_api_key"
    drop_capabilities = ["ALL"]
    no_new_privileges = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox-server
  namespace: x-harness-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensandbox-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensandbox-server
    spec:
      serviceAccountName: opensandbox-server
      containers:
        - name: opensandbox
          image: opensandbox/server:latest
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/opensandbox/config.toml
              subPath: config.toml
              readOnly: true
            - name: secret
              mountPath: /etc/opensandbox/secrets
              readOnly: true
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: config
          configMap:
            name: opensandbox-config
        - name: secret
          secret:
            secretName: opensandbox-secret
---
apiVersion: v1
kind: Service
metadata:
  name: opensandbox-server
  namespace: x-harness-sandbox
spec:
  selector:
    app.kubernetes.io/name: opensandbox-server
  ports:
    - name: http
      port: 8080
      targetPort: http
