# Default zero-privilege ServiceAccount (used by web, feishu, bootstrap Job — no K8s API token mounted).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: x-harness
  namespace: x-harness
automountServiceAccountToken: false
---
# Dedicated least-privilege ServiceAccount for api / worker / scheduler to manage sandbox Pods
# strictly inside the isolated `x-harness-sandbox` namespace (zero access to `x-harness` or cluster-wide resources).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: x-harness-sandbox-ctrl
  namespace: x-harness
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: x-harness-sandbox-manager
  namespace: x-harness-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: x-harness-sandbox-manager
  namespace: x-harness-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: x-harness-sandbox-manager
subjects:
  - kind: ServiceAccount
    name: x-harness-sandbox-ctrl
    namespace: x-harness
