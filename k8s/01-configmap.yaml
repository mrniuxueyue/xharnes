apiVersion: v1
kind: ConfigMap
metadata:
  name: x-harness-config
  namespace: x-harness
data:
  NODE_ENV: "production"
  XH_HOST: "0.0.0.0"
  XH_PORT: "8080"
  XH_LOG_LEVEL: "info"

  # Public URLs (replace with your production domain)
  XH_PUBLIC_BASE_URL: "https://xh.example.com"
  XH_CORS_ORIGINS: "https://xh.example.com"
  XH_COOKIE_NAME: "xh_sid"
  XH_COOKIE_SECURE: "true"
  XH_SESSION_TTL_HOURS: "12"

  # PostgreSQL & Redis Streams concurrency tuning
  XH_AUTO_MIGRATE: "true"
  XH_PG_POOL_MAX: "20"
  XH_RUN_SHARDS: "16"
  XH_REDIS_PREFIX: "xh:"
  XH_WORKER_CONCURRENCY: "20"
  XH_MAX_UPLOAD_MB: "50"

  # Standard S3 object storage (AWS S3 / MinIO / COS / OSS / R2)
  XH_OBJECT_STORE_DRIVER: "s3"
  XH_S3_REGION: "us-east-1"
  XH_S3_BUCKET: "xh-prod"
  # Optional public S3 download endpoint for presigned links (leave empty to reuse XH_S3_ENDPOINT)
  XH_S3_PUBLIC_ENDPOINT: ""

  # Native Kubernetes Pod sandbox runtime (zero external OpenSandbox/CRD dependency)
  # Pods are launched directly in x-harness-sandbox namespace with NetworkPolicy air-gap isolation.
  XH_SANDBOX_PROVIDER: "kubernetes"
  XH_K8S_SANDBOX_NAMESPACE: "x-harness-sandbox"
  XH_K8S_SANDBOX_IMAGE_PULL_POLICY: "IfNotPresent"
  # Comma-separated imagePullSecrets created in x-harness-sandbox namespace for private registries (e.g. "harbor-pull-secret")
  XH_K8S_SANDBOX_IMAGE_PULL_SECRETS: ""
  XH_DEFAULT_SANDBOX_IMAGE: "registry.example.com/xh/sbx-data:1.0.0"

  # Sandbox-external Credential Egress Proxy (Zero-Secret Sandbox: real cookies stay in Worker RAM, never enter sandbox)
  XH_EGRESS_PROXY_ENABLED: "true"
  XH_EGRESS_PROXY_PORT: "8081"

  # Security egress policy (false in production blocks loopback/RFC1918/IMDS SSRF and plain HTTP upstream)
  XH_ALLOW_PRIVATE_EGRESS: "false"
  XH_ALLOW_HTTP_EGRESS: "false"
  XH_FEISHU_ENABLED: "true"

  # Optional OpenTelemetry OTLP trace exporter (leave empty to disable)
  XH_OTLP_ENDPOINT: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: x-harness-web-nginx
  namespace: x-harness
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; frame-src 'self' blob:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      # SSE streaming endpoint: disable proxy buffering and keep connection open up to 1h
      location /api/v1/runs/ {
        proxy_pass http://x-harness-api.x-harness.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # Standard REST API & file uploads
      location /api/ {
        proxy_pass http://x-harness-api.x-harness.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
      }

      # Static assets aggressive caching
      location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
      }

      # Vue Router history mode SPA fallback (/chat, /workbenches, /decisions, /admin/*)
      location / {
        try_files $uri /index.html;
      }
    }
