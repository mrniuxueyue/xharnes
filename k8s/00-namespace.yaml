apiVersion: v1
kind: Namespace
metadata:
  name: x-harness
  labels:
    app.kubernetes.io/name: x-harness
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Dedicated isolated namespace for untrusted code-execution sandboxes
apiVersion: v1
kind: Namespace
metadata:
  name: x-harness-sandbox
  labels:
    app.kubernetes.io/name: x-harness-sandbox
    app.kubernetes.io/part-of: x-harness
    pod-security.kubernetes.io/enforce: restricted
