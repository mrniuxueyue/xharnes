# ==============================================================================
# IMPORTANT: DO NOT commit real production secrets to Git!
# Replace placeholders below before applying, OR sync via External Secrets / Sealed Secrets.
# Generate a strong master key with: openssl rand -hex 32
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: x-harness-secrets
  namespace: x-harness
type: Opaque
stringData:
  # PostgreSQL 16 (with pgvector extension)
  pg_write_url: "postgres://xh:CHANGE_ME_PG_PASSWORD@x-harness-postgres.x-harness.svc.cluster.local:5432/xh"
  pg_read_url: "postgres://xh:CHANGE_ME_PG_PASSWORD@x-harness-postgres.x-harness.svc.cluster.local:5432/xh"

  # Redis: separate Cache (allkeys-lru) and Streams (noeviction + AOF) instances recommended
  redis_cache_url: "redis://x-harness-redis-cache.x-harness.svc.cluster.local:6379/0"
  redis_streams_url: "redis://x-harness-redis-streams.x-harness.svc.cluster.local:6379/0"

  # Envelope encryption master key (REQUIRED in production, >= 32 characters)
  xh_master_key: "CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_HEX_32"

  # Initial bootstrap admin password (only used on first empty DB initialization)
  xh_seed_admin_password: "CHANGE_ME_ADMIN_PASSWORD_16CHARS"

  # Standard S3 Object Storage (AWS S3 / MinIO / COS / OSS / R2)
  s3_endpoint: "http://x-harness-minio.x-harness.svc.cluster.local:9000"
  s3_access_key: "CHANGE_ME_S3_ACCESS_KEY"
  s3_secret_key: "CHANGE_ME_S3_SECRET_KEY"

  # Optional: only needed if switching XH_SANDBOX_PROVIDER back to "opensandbox"
  # opensandbox_api_key: "CHANGE_ME_OPENSANDBOX_API_KEY"

  # Optional: protect Prometheus /metrics endpoint with Bearer token
  metrics_token: ""

  # Optional: commercial web search engines (zero-config DuckDuckGo + Wikipedia fallback works if empty)
  tavily_api_key: ""
  serper_api_key: ""
