apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: x-harness-api
  namespace: x-harness
  labels:
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: x-harness-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: x-harness-worker
  namespace: x-harness
  labels:
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: x-harness-worker
  minReplicas: 2
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Avoid thrashing while long-running multi-agent tasks drain
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: x-harness-api
  namespace: x-harness
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: x-harness
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: x-harness-worker
  namespace: x-harness
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: x-harness
      app.kubernetes.io/component: worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: x-harness-scheduler
  namespace: x-harness
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: x-harness
      app.kubernetes.io/component: scheduler
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: x-harness-web
  namespace: x-harness
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: x-harness
      app.kubernetes.io/component: web
---
# Zero-Trust Sandbox NetworkPolicy:
# - Sandboxes may ONLY receive traffic from the x-harness control-plane namespace.
# - Default-deny ALL egress (blocks RFC1918 private networks, cluster API, and cloud IMDS 169.254.169.254).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: x-harness-sandbox-default-deny
  namespace: x-harness-sandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: opensandbox
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: x-harness
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
